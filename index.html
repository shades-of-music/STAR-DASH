<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title> Super Star Dash</title>
</head>
<body>
<div class="game-shell">
	<div class="topbar">
	  <div class="title"><span class="sup">Super Star Dash </span></div>
	  <div class="stats">
		<div class="badge">⭐️ SCORE:  <strong id="score" class="yo">0</strong></div>
		<div class="badge">❤️ LIVES: <strong id="lives" class="yo">3</strong></div>
		<div class="badge">🏆 BEST: <strong id="best" class="yo">0</strong></div>
	  </div>
	</div>

	<canvas id="gameCanvas" width="700" height="520" aria-label="Star Dodge game area"></canvas>

	<div class="footer">
	  <div class="help"><span style="color: #9236BF;">To move on computer: A/D or ←/→; <br> To move on phone/tablet: ◀ / ▶ </span><br> <span style="color: #F7A848;">Objective: Collect stars and super stars (super stars last 10 seconds) </span><br><span style="color:#6D89C7;"> Avoid meteors</span></div>
	  <button class="help-icon" type="button" onclick="showAlertList()">?</button>
	  <button id="restartBtn" class= "thebutton"type="button">Start</button>

	</div>
  </div>
	 <div class="mobile-btns">
	<button id="leftBtn" class= "button" type="button"><</button>
	  <button id="rightBtn" class="button" type="button">></button>
</div>
</body>
