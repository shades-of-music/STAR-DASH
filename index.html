<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Dash</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap');
    :root {
      --bg1: #0b1020;
      --bg2: #141d35;
      --panel: rgba(16, 20, 38, 0.78);
      --panel-border: rgba(137, 167, 255, 0.45);
      --text: #ecf3ff;
      --muted: #b6caef;
      --accent: #7cf3ff;
      --accent2: #ffb454;
      --danger: #ff6b7d;
      --good: #7dffb4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, rgba(4, 40, 66, 0), rgba(110,70,61,0), rgba(192,192,192,0)),
                  url('https://wallpapercave.com/wp/wp2709706.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      overflow: auto;
      font-family: Comfortaa;
    }

    .game-shell {
      width: min(92vw, 700px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      overflow: hidden;
      position: relative;
}

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(10, 13, 24, 0.65);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .title {
      font-size: clamp(1.2rem, 2vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: Helvetica;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-family: Helvetica;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .badge strong {
      color: var(--text);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, rgba(18, 29, 58, 0.9), rgba(7, 11, 21, 0.96));
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(12, 16, 30, 0.7);
    }

    .help {
      color: var(--muted);
      font-size: 0.9rem;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #58a6ff);
      color: #06121f;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 18px rgba(82, 156, 255, 0.35);
    }
    /* Hide buttons on computers by default */
.mobile-btns {
  display: none;
}

/* Show buttons only when the screen is smaller than 768 pixels */
@media (max-width: 2360px) {
  .mobile-btns {
    display: flex;
    gap: 10px;
  }
}
    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div class="title">☆ Star Dash ☆</div>
      <div class="stats">
        <div class="badge">⭐️ SCORE  <strong id="score">0</strong></div>
        <div class="badge">❤️ LIVES <strong id="lives">3</strong></div>
        <div class="badge">🏆 BEST <strong id="best">0</strong></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="700" height="520" aria-label="Star Dodge game area"></canvas>

    <div class="footer">
      <div class="help"><span style="color: #9236BF;">To move on computer: A/D or ←/→; <br> To move on phone/tablet: ◀ / ▶ </span><br> <span style="color: #F7A848;">Objective: Collect stars and power stars </span><br><span style="color:#6D89C7;"> Avoid meteors</span></div>
      <button id="restartBtn" type="button">Start</button>
      <div class="mobile-btns">
  <button id="leftBtn" type="button">◀</button>
  <div class="help">Collect stars & avoid meteors</div>
  <button id="rightBtn" type="button">▶</button>
</div>
    </div>
  </div>

  <script>
    alert("as with all of my projects, i would like to remind you that God loves you, and He sent his son to die for you so that you could spend eternity with him! ❤️");
    alert("you can find me on Sololearn at https://www.sololearn.com/en/profile/20511470");
    alert("ps made with HTML, CSS, JS; repository is on GitHub, hosted by Netlify; licensed under Creative Commons license CC-BY-NC-SA");
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restartBtn');

    let audioCtx = null;
    function playTinkle() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    const game = {
      state: 'ready',
      score: 0,
      best: Number(localStorage.getItem('starDodgeBest') || 0),
      lives: 3,
      lastTime: 0,
      spawnTimer: 0,
      starTimer: 0,
      allStarTimer: 0,
      has100Animation: 0,
      shieldTime: 0,
      player: null,
      projectiles: [],
      stars: [],
      allStars: [],
      particles: []
    };

    const keys = { left: false, right: false };

    function updateHUD() {
      scoreEl.textContent = String(game.score);
      livesEl.textContent = String(game.lives);
      bestEl.textContent = String(game.best);
    }

    function resetGame() {
      game.score = 0;
      game.lives = 3;
      game.spawnTimer = 0;
      game.starTimer = 0;
      game.allStarTimer = 5.0;
      game.has100Animation = 0;
      game.shieldTime = 0;
      game.projectiles = [];
      game.stars = [];
      game.allStars = [];
      game.particles = [];
      game.player = {
        x: canvas.width / 2,
        y: canvas.height - 52,
        width: 32,
        height: 36,
        speed: 420,
        color: '#7cf3ff'
      };
      updateHUD();
      restartBtn.textContent = 'Restart';
    }

    function startGame() {
      resetGame();
      game.state = 'playing';
      requestAnimationFrame(loop);
    }

    function endGame() {
      game.state = 'gameover';
      if (game.score > game.best) {
        game.best = game.score;
        localStorage.setItem('starDodgeBest', String(game.best));
      }
      updateHUD();
      restartBtn.textContent = 'Play Again';
    }

    function spawnMeteor() {
  const radius = 10 + Math.random() * 18;
  const x = radius + Math.random() * (canvas.width - radius * 2);
  
  // This stops the speed multiplier from going past 1.8 (80% faster)
  const speedMultiplier = Math.min(1.5, 1 + (game.score * 0.005));
  const speed = (140 + Math.random() * 180) * speedMultiplier;
  
  game.projectiles.push({
    x,
    y: -radius,
    radius,
    speed,
    drift: (Math.random() - 0.5) * 90,
    rotation: Math.random() * Math.PI * 2
  });
}

    function spawnStar() {
      const radius = 8 + Math.random() * 6;
      const x = radius + Math.random() * (canvas.width - radius * 2);
      const speed = 140 + Math.random() * 100;
      game.stars.push({
        x,
        y: -radius,
        radius,
        speed,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function spawnAllStar() {
      const radius = 14;
      const x = radius + Math.random() * (canvas.width - radius * 2);
      game.allStars.push({
        x,
        y: -radius,
        radius,
        speed: 160,
        pulse: 0
      });
    }

    function createBurst(x, y, color, amount = 12) {
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = 40 + Math.random() * 120;
        game.particles.push({
          x, y,
          radius: 2 + Math.random() * 3,
          dx: Math.cos(angle) * velocity,
          dy: Math.sin(angle) * velocity,
          life: 0.8 + Math.random() * 0.6,
          color
        });
      }
    }

    function handleInput(dt) {
      if (!game.player) return;
      if (keys.left) game.player.x -= game.player.speed * dt;
      if (keys.right) game.player.x += game.player.speed * dt;
      game.player.x = Math.max(22, Math.min(canvas.width - 22, game.player.x));
    }

    function updateObstacles(dt) {
      const player = game.player;
      if (!player) return;

      if (game.shieldTime > 0) game.shieldTime -= dt;

      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        spawnMeteor();
        game.spawnTimer = Math.max(0.2, 1.05 - game.score * 0.015);
      }

      game.starTimer -= dt;
      if (game.starTimer <= 0) {
        spawnStar();
        game.starTimer = 1.4 + Math.random() * 1.3;
      }

      game.allStarTimer -= dt;
      if (game.allStarTimer <= 0) {
        spawnAllStar();
        game.allStarTimer = 8 + Math.random() * 6;
      }

      if (game.has100Animation > 0) {
        game.has100Animation -= dt;
      }

      // Meteors collision
      for (let i = game.projectiles.length - 1; i >= 0; i--) {
        const m = game.projectiles[i];
        m.y += m.speed * dt;
        m.x += m.drift * dt;
        m.rotation += dt * 2.3;

        if (m.y - m.radius > canvas.height) {
          game.projectiles.splice(i, 1);
          continue;
        }

        const dist = Math.hypot(m.x - player.x, m.y - (player.y + player.height * 0.5));
        if (dist < m.radius + 18) {
          game.projectiles.splice(i, 1);
          if (game.shieldTime <= 0) {
            game.lives -= 1;
            createBurst(m.x, m.y, '#ff6b7d', 20);
            if (game.lives <= 0) {
              endGame();
              return;
            }
          } else {
            createBurst(m.x, m.y, '#7cf3ff', 15);
          }
          updateHUD();
        }
      }

      // Normal stars collision
      for (let i = game.stars.length - 1; i >= 0; i--) {
        const s = game.stars[i];
        s.y += s.speed * dt;
        s.pulse += dt * 6;

        const dist = Math.hypot(s.x - player.x, s.y - (player.y + player.height * 0.5));
        if (dist < s.radius + 18) {
          const oldScore = game.score;
          game.stars.splice(i, 1);
          game.score += 10;
          createBurst(s.x, s.y, '#7dffb4', 14);

          // Check if crossed 100
          if (oldScore < 100 && game.score >= 100) {
            playTinkle();
            game.has100Animation = 2.0;
          }

          if (game.score > game.best) {
            game.best = game.score;
            localStorage.setItem('starDodgeBest', String(game.best));
          }
          updateHUD();
        } else if (s.y - s.radius > canvas.height) {
          game.stars.splice(i, 1);
        }
      }

      // All-star powerup collision
      for (let i = game.allStars.length - 1; i >= 0; i--) {
        const as = game.allStars[i];
        as.y += as.speed * dt;
        as.pulse += dt * 8;

        const dist = Math.hypot(as.x - player.x, as.y - (player.y + player.height * 0.5));
        if (dist < as.radius + 18) {
          game.allStars.splice(i, 1);
          game.score += 50;
          game.shieldTime = 5.0; // 5 seconds shield
          playTinkle();
          createBurst(as.x, as.y, '#ffb454', 25);
          if (game.score > game.best) {
            game.best = game.score;
            localStorage.setItem('starDodgeBest', String(game.best));
          }
          updateHUD();
        } else if (as.y - as.radius > canvas.height) {
          game.allStars.splice(i, 1);
        }
      }

      // Particles
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.dx * dt;
        p.y += p.dy * dt;
        p.life -= dt;
        if (p.life <= 0) game.particles.splice(i, 1);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#152852');
      sky.addColorStop(1, '#070c18');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 80; i++) {
        const x = ((i * 137.11) % canvas.width);
        const y = ((i * 79.37) % (canvas.height + 40)) - 20;
        const radius = 1 + (i % 3);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + (i % 5) * 0.1).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      const p = game.player;
      if (!p) return;

      ctx.save();
      ctx.translate(p.x, p.y);

      if (game.shieldTime > 0) {
        ctx.strokeStyle = '#ffb454';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, p.width, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(0, -p.height / 2);
      ctx.lineTo(p.width / 2, p.height / 2);
      ctx.lineTo(0, p.height / 4);
      ctx.lineTo(-p.width / 2, p.height / 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.fillRect(-4, -8, 8, 14);
      ctx.restore();
    }

    function drawMeteor(m) {
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.rotation);
      ctx.fillStyle = '#b5bfd5';
      ctx.beginPath();
      ctx.moveTo(-m.radius, 0);
      ctx.lineTo(-m.radius * 0.5, -m.radius * 1.1);
      ctx.lineTo(m.radius * 0.4, -m.radius * 0.9);
      ctx.lineTo(m.radius, -m.radius * 0.2);
      ctx.lineTo(m.radius * 0.9, m.radius * 0.9);
      ctx.lineTo(0, m.radius * 1.1);
      ctx.lineTo(-m.radius * 0.9, m.radius * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawStar(s, isAllStar = false) {
      const points = 5;
      const outer = s.radius;
      const inner = s.radius * 0.45;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.pulse * 0.4);
      ctx.fillStyle = isAllStar ? '#4DFF97' : '#ffd76a';
      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const angle = (Math.PI / points) * i - Math.PI / 2;
        const radius = i % 2 === 0 ? outer : inner;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawParticles() {
      for (const p of game.particles) {
        ctx.fillStyle = p.color + 'dd';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawAnimations() {
      if (game.has100Animation > 0) {
        ctx.save();
        ctx.font = '700 36px Arial';
        ctx.fillStyle = '#7dffb4';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#7dffb4';
        ctx.shadowBlur = 15;
        ctx.fillText('⭐ 100 POINTS! AWESOME! ⭐', canvas.width / 2, 120);
        ctx.restore();
      }
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(4, 8, 18, 0.63)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#FF4D4D';
      ctx.textAlign = 'center';
      ctx.font = '700 42px Helvetica';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '600 22px Arial';
      ctx.fillStyle = '#b6caef';
      ctx.fillText('Final Score: ' + game.score, canvas.width / 2, canvas.height / 2 + 30);
    }

    function update(dt) {
      if (game.state !== 'playing') return;
      handleInput(dt);
      updateObstacles(dt);
    }

    function render() {
      drawBackground();
      if (game.player) drawPlayer();
      for (const m of game.projectiles) drawMeteor(m);
      for (const s of game.stars) drawStar(s);
      for (const as of game.allStars) drawStar(as, true);
      drawParticles();
      drawAnimations();
      if (game.state === 'gameover') drawGameOver();
    }

    function loop(timestamp) {
      const dt = Math.min(0.035, (timestamp - game.lastTime) / 1000 || 0.016);
      game.lastTime = timestamp;

      update(dt);
      render();

      if (game.state === 'playing') {
        requestAnimationFrame(loop);
      }
    }

    function handleKeyChange(event, isPressed) {
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keys.left = isPressed;
      if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keys.right = isPressed;
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(event.key)) {
        event.preventDefault();
      }
      handleKeyChange(event, true);
      if (event.key === ' ' && game.state !== 'playing') {
        event.preventDefault();
        startGame();
      }
    });

    document.addEventListener('keyup', (event) => {
      handleKeyChange(event, false);
    });

    restartBtn.addEventListener('click', () => {
      startGame();
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (game.state !== 'playing') {
        startGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const ratioX = (event.clientX - rect.left) / rect.width;
      game.player.x = ratioX * canvas.width;
    });

    canvas.addEventListener('pointermove', (event) => {
      if (game.state !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const ratioX = (event.clientX - rect.left) / rect.width;
      game.player.x = ratioX * canvas.width;
    });

    bestEl.textContent = String(game.best);
    resetGame();
    const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');

leftBtn.addEventListener('pointerdown', () => keys.left = true);
leftBtn.addEventListener('pointerup', () => keys.left = false);
leftBtn.addEventListener('pointerleave', () => keys.left = false);

rightBtn.addEventListener('pointerdown', () => keys.right = true);
rightBtn.addEventListener('pointerup', () => keys.right = false);
rightBtn.addEventListener('pointerleave', () => keys.right = false);
    render();
  </script>
</body>
</html>
